# Common reverse-proxy headers for the app vhosts. Use inside a `location`
# alongside a `proxy_pass`. $connection_upgrade is defined once in
# conf.d/10-connection-upgrade.conf.
proxy_http_version 1.1;
proxy_set_header Upgrade            $http_upgrade;
proxy_set_header Connection         $connection_upgrade;
proxy_set_header Host               $host;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-Forwarded-Host   $host;
# NOTE: no proxy_read_timeout here on purpose — nginx's default is already 60s,
# and vhosts that need longer (co.uk 86400s, me 300s) set their own. Defining it
# here too would be a duplicate directive in those locations.
