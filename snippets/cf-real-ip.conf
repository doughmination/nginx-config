# =============================================================================
# cloudflare-realip.conf — restore the visitor's real IP behind Cloudflare
# =============================================================================
#
# WHY THIS EXISTS
# ---------------
# Every site on this box is proxied through Cloudflare (orange cloud), so the
# TCP peer nginx sees is always a Cloudflare edge node — never the visitor.
# Without this file, $remote_addr is a Cloudflare IP, which silently breaks:
#
#   * access logs            -> every line shows a CF edge, not the visitor
#   * limit_req / limit_conn -> ALL visitors share one bucket; one user can
#                               rate-limit the entire site
#   * allow / deny rules     -> you're allow/denying Cloudflare, not people
#   * geo / GeoIP modules    -> everyone appears to be in a CF datacenter
#   * fail2ban & app-side bans -> you ban Cloudflare and take the site down
#
# Note: this is NOT app-specific. A static React/SPA build renders fine without
# it. What breaks is anything that cares about *who* the client is.
#
# HOW IT WORKS
# ------------
#   set_real_ip_from <cidr>   Marks a CIDR as a TRUSTED proxy. nginx only
#                             honours the real-IP header from these sources —
#                             a random host spoofing CF-Connecting-IP is ignored.
#   real_ip_header            The header to read the true client IP from.
#                             Cloudflare sets CF-Connecting-IP on every request.
#   real_ip_recursive         Walk right-to-left past trusted proxies. Harmless
#                             with CF-Connecting-IP (single value); matters if
#                             you ever switch to X-Forwarded-For.
#
# MAINTENANCE
# -----------
# Source of truth (change rarely, but they DO change):
#   IPv4: https://www.cloudflare.com/ips-v4
#   IPv6: https://www.cloudflare.com/ips-v6
#   API:  https://api.cloudflare.com/client/v4/ips
# If real IPs suddenly stop resolving, re-check those URLs FIRST. Consider a
# cron job that regenerates this file and reloads nginx.
#
# Verified current: 2026-07-14
#
# USAGE
# -----
# Include from the http{} block in /etc/nginx/nginx.conf:
#
#     http {
#         include /etc/nginx/conf.d/cloudflare-realip.conf;
#         ...
#     }
#
# Requires nginx built --with-http_realip_module
# (check: nginx -V 2>&1 | grep realip).
# Apply with: nginx -t && systemctl reload nginx
# =============================================================================


# --- Cloudflare IPv4 edge ranges ---------------------------------------------
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;

# --- Cloudflare IPv6 edge ranges ---------------------------------------------
# Skipping these does NOT fail loudly: v6 visitors just keep showing a CF edge
# address while v4 visitors look correct. Keep them even if you think you're
# v4-only — a stray AAAA record or `listen [::]:443` is all it takes.
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# --- Header to trust from the above sources ----------------------------------
real_ip_header    CF-Connecting-IP;
real_ip_recursive on;
