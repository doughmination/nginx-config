# TLS for every doughmination.* vhost. All doughmination domains share the one
# `doughmination` Let's Encrypt SAN cert, so expand that cert's domain list with
# certbot rather than issuing new certs (see the deploy notes / README).
ssl_certificate     /etc/letsencrypt/live/doughmination.me/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/doughmination.me/privkey.pem;
include             /etc/letsencrypt/options-ssl-nginx.conf;
ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
