# TLS for every doughmination.* vhost plus the doughmination.gay subdomains
# (backup, bin). They all share the one `doughmination` Let's Encrypt SAN
# cert, so expand that cert's domain list with certbot rather than issuing new
# certs (see the deploy notes / README).
ssl_certificate     /etc/letsencrypt/live/doughmination/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/doughmination/privkey.pem;
include             /etc/letsencrypt/options-ssl-nginx.conf;
ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
