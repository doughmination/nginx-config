
# backup.doughmination.gay -> dough-git (127.0.0.1:4010)

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name backup.doughmination.gay;
    return 301 https://backup.doughmination.gay$request_uri;
}

# apex -> dough-git
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backup.doughmination.gay;

    include snippets/ssl-doughmination.conf;
    include snippets/cf-real-ip.conf;
    include snippets/headers.conf;

    # git push/clone can ship large packfiles; don't cap the body size and
    # stream it straight through rather than buffering to disk first.
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:4010;
        include snippets/proxy-common.conf;

        # Large clones/pushes can take a while (overrides the 60s default
        # from proxy-common.conf).
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
