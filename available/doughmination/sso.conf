# sso.doughmination.gay -> pocket-id (127.0.0.1:1411)

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sso.doughmination.gay;
    return 301 https://sso.doughmination.gay$request_uri;
}

# apex -> SSO app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sso.doughmination.gay;

    include snippets/ssl-doughmination.conf;
    include snippets/cf-real-ip.conf;
    include snippets/headers.conf;

    location / {
        proxy_pass http://127.0.0.1:1411;
        include snippets/proxy-common.conf;
    }
}
