# doughmination.systems -> Dozzle (127.0.0.1:4181)

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name doughmination.systems www.doughmination.systems;
    return 301 https://doughmination.systems$request_uri;
}

# www -> apex (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.doughmination.systems;
    include snippets/ssl-doughmination.conf;
    return 301 https://doughmination.systems$request_uri;
}

# apex -> Dozzle (streams container logs over WebSocket)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name doughmination.systems;

    include snippets/ssl-doughmination.conf;
    include snippets/cf-real-ip.conf;
    include snippets/headers.conf;

    location / {
        proxy_pass http://127.0.0.1:4181;
        include snippets/proxy-common.conf;
    }
}
