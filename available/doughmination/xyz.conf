# doughmination.xyz -> SSO / pocket-id (127.0.0.1:1411)

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name doughmination.xyz www.doughmination.xyz;
    return 301 https://doughmination.xyz$request_uri;
}

# www -> apex (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.doughmination.xyz;
    include snippets/ssl-doughmination.conf;
    return 301 https://doughmination.xyz$request_uri;
}

# apex -> SSO app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name doughmination.xyz;

    include snippets/ssl-doughmination.conf;
    include snippets/cf-real-ip.conf;
    include snippets/headers.conf;

    location / {
        proxy_pass http://127.0.0.1:1411;
        include snippets/proxy-common.conf;
    }
}
