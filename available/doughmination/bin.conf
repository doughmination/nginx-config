
# bin.doughmination.gay -> minibin (127.0.0.1:8088)

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bin.doughmination.gay;
    return 301 https://bin.doughmination.gay$request_uri;
}

# apex -> minibin
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bin.doughmination.gay;

    include snippets/ssl-doughmination.conf;
    include snippets/cf-real-ip.conf;
    include snippets/headers.conf;

    # Pastes are text, but people do dump whole logfiles in. 16m is generous
    # without letting the box be used as file storage.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        include snippets/proxy-common.conf;
    }
}
