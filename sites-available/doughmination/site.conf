# doughmination.site -> blog (127.0.0.1:4010)
#
# NOTE: doughmination.site is NOT yet on the `doughmination` cert. Expand the
# cert to include it before enabling this vhost (see deploy notes), otherwise
# nginx -t / reload will fail on a missing SAN.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name doughmination.site www.doughmination.site;
    return 301 https://doughmination.site$request_uri;
}

# www -> apex (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.doughmination.site;
    include snippets/ssl-doughmination.conf;
    return 301 https://doughmination.site$request_uri;
}

# apex -> Next.js app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name doughmination.site;

    include snippets/ssl-doughmination.conf;
    include snippets/cf-real-ip.conf;
    include snippets/headers.conf;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4010;
        include snippets/proxy-common.conf;
    }
}
