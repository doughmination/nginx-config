# doughmination.co.uk -> system (127.0.0.1:4030)

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name doughmination.co.uk www.doughmination.co.uk;
    return 301 https://doughmination.co.uk$request_uri;
}

# www -> apex (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.doughmination.co.uk;
    include snippets/ssl-doughmination.conf;
    return 301 https://doughmination.co.uk$request_uri;
}

# apex -> system frontend
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name doughmination.co.uk;

    include snippets/ssl-doughmination.conf;
    include snippets/cf-real-ip.conf;
    include snippets/headers.conf;

    location / {
        proxy_pass http://127.0.0.1:4030;
        include snippets/proxy-common.conf;

        # System frontend holds long-lived connections; override the 60s default.
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
