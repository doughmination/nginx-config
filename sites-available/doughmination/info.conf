# doughmination.info -> info (127.0.0.1:4020)

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name doughmination.info www.doughmination.info;
    return 301 https://doughmination.info$request_uri;
}

# www -> apex (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.doughmination.info;
    include snippets/ssl-doughmination.conf;
    return 301 https://doughmination.info$request_uri;
}

# apex -> Next.js app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name doughmination.info;

    include snippets/ssl-doughmination.conf;
    include snippets/cf-real-ip.conf;
    include snippets/headers.conf;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4020;
        include snippets/proxy-common.conf;
    }
}
