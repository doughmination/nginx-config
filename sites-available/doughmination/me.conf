# doughmination.me -> music (127.0.0.1:4060)

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name doughmination.me www.doughmination.me;
    return 301 https://doughmination.me$request_uri;
}

# www -> apex (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.doughmination.me;
    include snippets/ssl-doughmination.conf;
    return 301 https://doughmination.me$request_uri;
}

# apex -> music app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name doughmination.me;

    include snippets/ssl-doughmination.conf;
    include snippets/cf-real-ip.conf;
    include snippets/headers.conf;

    # Large audio uploads (the 413 fix). Keep this >= MUSIC_MAX_UPLOAD_MB
    # (default 200M).
    client_max_body_size 500M;

    # Internal target for the app's X-Accel-Redirect. Not reachable directly.
    location /_media/ {
        internal;
        alias /srv/web/player/data/media/;   # host side of ./data:/app/data
        aio threads;                                         # better concurrency for a big library
    }

    location / {
        proxy_pass http://127.0.0.1:4060;
        include snippets/proxy-common.conf;

        # Stream uploads straight to the app instead of buffering to disk first.
        proxy_request_buffering off;

        # Don't cut off long uploads / long-held audio streams (overrides the
        # 60s read timeout from proxy-common.conf).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
