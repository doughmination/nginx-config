# fonts.doughmination.co.uk -> static Comic Code archive (/srv/web/web/fonts)

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fonts.doughmination.co.uk;
    return 301 https://$host$request_uri;
}

# HTTPS static host
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fonts.doughmination.co.uk;

    include snippets/ssl-doughmination.conf;
    include snippets/cf-real-ip.conf;
    include snippets/headers.conf;

    root /srv/web/web/fonts;
    index index.html;

    # Serve fonts with permissive CORS + long immutable caching.
    location ~* \.(woff2?|ttf|otf|eot)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types {
            font/woff2 woff2;
            font/woff  woff;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
