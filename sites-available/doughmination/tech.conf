# doughmination.tech -> mailbox / inbox (127.0.0.1:4040)

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name doughmination.tech www.doughmination.tech;
    return 301 https://doughmination.tech$request_uri;
}

# www -> apex (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.doughmination.tech;
    include snippets/ssl-doughmination.conf;
    return 301 https://doughmination.tech$request_uri;
}

# apex -> mailbox app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name doughmination.tech;

    include snippets/ssl-doughmination.conf;
    include snippets/cf-real-ip.conf;
    include snippets/headers.conf;

    location / {
        proxy_pass http://127.0.0.1:4040;
        include snippets/proxy-common.conf;
    }
}
