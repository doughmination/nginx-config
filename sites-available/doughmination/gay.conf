# backup.doughmination.gay -> minigit git mirror (127.0.0.1:4010)
#
# NOTE: backup.doughmination.gay must be added to the `doughmination` SAN cert
# BEFORE enabling this vhost, otherwise clients get a cert-name mismatch. Expand
# the cert with certbot (see deploy notes / the chat that added this file), then
# `ln -s` it into sites-enabled and reload.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name backup.doughmination.gay;
    return 301 https://backup.doughmination.gay$request_uri;
}

# HTTPS -> minigit
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backup.doughmination.gay;

    include snippets/ssl-doughmination.conf;
    include snippets/cf-real-ip.conf;
    include snippets/headers.conf;

    # Git pushes/clones can be large; don't cap or buffer the request body, and
    # give big fetches room before timing out. `0` = unlimited upload size.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:4010;
        include snippets/proxy-common.conf;

        # Stream git's smart-HTTP bodies instead of buffering whole packfiles.
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout      300s;
    }
}
