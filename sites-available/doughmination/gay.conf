# doughmination.gay -> personal (127.0.0.1:4050)

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name doughmination.gay www.doughmination.gay;
    return 301 https://doughmination.gay$request_uri;
}

# www -> apex (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.doughmination.gay;
    include snippets/ssl-doughmination.conf;
    return 301 https://doughmination.gay$request_uri;
}

# apex -> Next.js app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name doughmination.gay;

    include snippets/ssl-doughmination.conf;
    include snippets/cf-real-ip.conf;
    include snippets/headers.conf;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4050;
        include snippets/proxy-common.conf;
    }
}
