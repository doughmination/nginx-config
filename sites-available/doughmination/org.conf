# doughmination.org -> status (127.0.0.1:4080)
# Public status page at /, PocketID-gated admin at /admin (enforced by the app).

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name doughmination.org www.doughmination.org;
    return 301 https://doughmination.org$request_uri;
}

# www -> apex (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.doughmination.org;
    include snippets/ssl-doughmination.conf;
    return 301 https://doughmination.org$request_uri;
}

# apex -> Next.js app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name doughmination.org;

    include snippets/ssl-doughmination.conf;
    include snippets/cf-real-ip.conf;
    include snippets/headers.conf;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4080;
        include snippets/proxy-common.conf;
    }
}
