# Legacy stupid.cat hosts that now live at doughmination.gay. Kept as redirects
# so old links keep working. These use the stupid.cat cert (not the
# doughmination cert), since the hostnames are *.stupid.cat.

# HTTP -> new domain
server {
    listen 80;
    listen [::]:80;
    server_name c.stupid.cat clove.stupid.cat;
    return 301 https://doughmination.gay$request_uri;
}

# HTTPS -> new domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name c.stupid.cat clove.stupid.cat;

    ssl_certificate     /etc/letsencrypt/live/stupid.cat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stupid.cat/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://doughmination.gay$request_uri;
}
