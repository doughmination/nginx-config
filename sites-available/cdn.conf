# ---------------------------------------------------------------------------
# cdn.stupid.cat / assets.stupid.cat
#
# Note: proxy_cache_path can only be declared at the http{} level, not inside
# a server block. Add this line to /etc/nginx/nginx.conf (inside the top
# level `http { ... }` block), or to a file in /etc/nginx/conf.d/ that's
# included from it:
#
#   proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:10m
#                     max_size=2g inactive=60m use_temp_path=off;
#
# Then: mkdir -p /var/cache/nginx/cdn && chown www-data:www-data /var/cache/nginx/cdn
# (adjust the user to whatever Nginx actually runs as on your system).
#
# Optional abuse-mitigation zone, also at the http{} level:
#
#   limit_req_zone $binary_remote_addr zone=embed_limit:10m rate=30r/m;
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;

    server_name cdn.stupid.cat assets.stupid.cat;

    return 301 https://cdn.stupid.cat$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name assets.stupid.cat;

    ssl_certificate     /etc/letsencrypt/live/stupid.cat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stupid.cat/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://cdn.stupid.cat$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name cdn.stupid.cat;

    ssl_certificate     /etc/letsencrypt/live/stupid.cat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stupid.cat/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/cf-real-ip.conf;

    # -----------------------------------------------------------------
    # Cached embed previews — served directly by Nginx, never touches
    # Node. Filenames are content-addressed (sha256 of source path +
    # size + mtime), so a given filename's bytes never change: safe to
    # cache "forever" and no cache-busting logic is needed.
    #
    # Replace /opt/doughmination-cdn with wherever compose.yml actually
    # lives on the host. This path must match the LEFT side of the
    # "./cdn/cdn-cache:/app/cdn-cache" volume mount in compose.yml.
    # -----------------------------------------------------------------
    location /m-cache/ {
        alias /srv/ari/cdn/cdn/cdn-cache/m/;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";

        location ~* \.webp$ {
            default_type image/webp;
        }
        location ~ /\.\.?/ { deny all; }

        try_files $uri =404;
        access_log off;
    }

    # -----------------------------------------------------------------
    # /m/:file — must hit Node for bot-detection + on-demand generation.
    # -----------------------------------------------------------------
    location /m/ {
        # Uncomment once the embed_limit zone above is declared:
        # limit_req zone=embed_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:5080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # First hit for a given file can take a moment (sharp encoding).
        proxy_read_timeout 30s;

        # Small dynamic HTML response — no need to buffer it.
        proxy_buffering off;
    }

    # -----------------------------------------------------------------
    # /cdn/ raw assets. Stays on Node (honeypot/teapot logic and the
    # extension allowlist live in server.ts) but gets a micro-cache to
    # absorb concurrent-request bursts on a single popular file down
    # into one upstream request.
    # -----------------------------------------------------------------
    location /cdn/ {
        proxy_pass http://127.0.0.1:5080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_request_buffering on;

        # Requires the proxy_cache_path directive noted at the top of
        # this file, in the http{} block.
        proxy_cache cdn_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # -----------------------------------------------------------------
    # Everything else (admin, api, static frontend, SPA catch-all).
    # -----------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:5080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Useful for larger asset uploads/downloads
        proxy_buffering on;
        proxy_request_buffering on;
    }
}
