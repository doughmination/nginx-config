# Shared WebSocket upgrade map — defined ONCE here, in http context, via
# nginx.conf's `include /etc/nginx/conf.d/*.conf;` (which loads before
# sites-enabled). This block was previously duplicated in clove-info,
# clove-stupidcat and mastodon; enabling more than one at once produced the
# "duplicate map \"$connection_upgrade\"" error. Referenced as
# $connection_upgrade from snippets/proxy-common.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
