# Owns the :443 socket protocol options (ssl + http2) so individual vhosts don't
# repeat `http2` on their own listen lines.
#
# On nginx < 1.25.1 (this box runs 1.24) `http2` may only be set on the FIRST
# server that defines a listen socket; repeating it on later server blocks emits
# "protocol options redefined for 0.0.0.0:443" warnings. conf.d/*.conf is
# included before sites-enabled/*, so this block defines HTTP/2 for the socket
# exactly once and every other vhost just uses `listen 443 ssl;`.
#
# It doubles as the default_server: any connection whose SNI/Host matches no
# other server_name is dropped with 444 instead of silently falling through to
# whichever vhost happened to load first. Every real site here is addressed by
# hostname behind Cloudflare, so unmatched hosts have no legitimate use.
#
# NOTE: keep this the ONLY place `http2` (and default_server) appears for :443.
# When nginx is eventually >= 1.25.1, this whole file can be replaced by a single
# `http2 on;` in nginx.conf's http{} block and the default_server kept if wanted.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    include snippets/ssl-doughmination.conf;

    return 444;
}
