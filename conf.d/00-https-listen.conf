# Owns the :443 default_server. HTTP/2 itself is enabled per-server via the
# `http2 on;` directive (nginx >= 1.25.1) — it no longer needs to live only on
# the first server block for the socket, so every vhost sets it independently
# on its own 443 server block instead of inheriting it from here.
#
# This block doubles as the default_server: any connection whose SNI/Host
# matches no other server_name is dropped with 444 instead of silently falling
# through to whichever vhost happened to load first. Every real site here is
# addressed by hostname behind Cloudflare, so unmatched hosts have no
# legitimate use.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    include snippets/ssl-doughmination.conf;

    return 444;
}
